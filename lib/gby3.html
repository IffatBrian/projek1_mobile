```html
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>I LOVE YOU Portrait</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        background: #000;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      h1 {
        margin: 5px 0;
      }

      p {
        color: #999;
      }

      .panel {
        width: 95%;
        max-width: 600px;
        margin: auto;
      }

      input[type="file"] {
        width: 100%;
        padding: 12px;
        background: #181818;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        margin: 15px 0;
      }

      .control {
        text-align: left;
        margin: 15px 0;
      }

      label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      input[type="range"] {
        width: 100%;
      }

      button {
        padding: 12px 20px;
        margin: 10px 4px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
      }

      #result {
        width: 100%;
        overflow: auto;
        margin-top: 25px;
      }

      canvas {
        display: block;
        margin: auto;
        background: #000;
        max-width: 100%;
      }
    </style>
  </head>

  <body>
    <h1>I LOVE YOU</h1>

    <p>Text Portrait Generator</p>

    <div class="panel">
      <input type="file" id="upload" accept="image/*" />

      <div class="control">
        <label>
          Ukuran Teks
          <span id="sizeValue">5</span>
        </label>

        <input type="range" id="size" min="2" max="10" value="5" />
      </div>

      <div class="control">
        <label>
          Jarak Horizontal
          <span id="xValue">0</span>
        </label>

        <input type="range" id="spacingX" min="-3" max="5" step="1" value="0" />
      </div>

      <div class="control">
        <label>
          Jarak Vertikal
          <span id="yValue">0</span>
        </label>

        <input type="range" id="spacingY" min="-3" max="5" step="1" value="0" />
      </div>

      <div class="control">
        <label>
          Kegelapan
          <span id="darkValue">1.7</span>
        </label>

        <input
          type="range"
          id="darkness"
          min="0.5"
          max="3"
          step="0.1"
          value="1.7"
        />
      </div>

      <div class="control">
        <label>
          Contrast
          <span id="contrastValue">1.6</span>
        </label>

        <input
          type="range"
          id="contrast"
          min="0.5"
          max="3"
          step="0.1"
          value="1.6"
        />
      </div>

      <button onclick="downloadImage()">Simpan Gambar</button>
    </div>

    <div id="result">
      <canvas id="canvas"></canvas>
    </div>

    <script>
      const upload = document.getElementById("upload");

      const canvas = document.getElementById("canvas");

      const ctx = canvas.getContext("2d");

      const sizeSlider = document.getElementById("size");

      const spacingXSlider = document.getElementById("spacingX");

      const spacingYSlider = document.getElementById("spacingY");

      const darknessSlider = document.getElementById("darkness");

      const contrastSlider = document.getElementById("contrast");

      const sizeValue = document.getElementById("sizeValue");

      const xValue = document.getElementById("xValue");

      const yValue = document.getElementById("yValue");

      const darkValue = document.getElementById("darkValue");

      const contrastValue = document.getElementById("contrastValue");

      let photo = null;

      // =====================================
      // UPLOAD FOTO
      // =====================================

      upload.addEventListener("change", function () {
        const file = this.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function (event) {
          photo = new Image();

          photo.onload = function () {
            createPortrait();
          };

          photo.src = event.target.result;
        };

        reader.readAsDataURL(file);
      });

      // =====================================
      // SLIDER
      // =====================================

      sizeSlider.oninput = function () {
        sizeValue.textContent = this.value;

        createPortrait();
      };

      spacingXSlider.oninput = function () {
        xValue.textContent = this.value;

        createPortrait();
      };

      spacingYSlider.oninput = function () {
        yValue.textContent = this.value;

        createPortrait();
      };

      darknessSlider.oninput = function () {
        darkValue.textContent = this.value;

        createPortrait();
      };

      contrastSlider.oninput = function () {
        contrastValue.textContent = this.value;

        createPortrait();
      };

      // =====================================
      // CREATE PORTRAIT
      // =====================================

      function createPortrait() {
        if (!photo) return;

        // Ukuran hasil
        const MAX_WIDTH = 1000;

        let width = photo.naturalWidth;

        let height = photo.naturalHeight;

        // Pertahankan rasio foto
        if (width > MAX_WIDTH) {
          height = Math.round((height * MAX_WIDTH) / width);

          width = MAX_WIDTH;
        }

        canvas.width = width;
        canvas.height = height;

        // ===================================
        // CANVAS FOTO
        // ===================================

        const source = document.createElement("canvas");

        source.width = width;
        source.height = height;

        const sourceCtx = source.getContext("2d");

        sourceCtx.drawImage(photo, 0, 0, width, height);

        const image = sourceCtx.getImageData(0, 0, width, height);

        const pixels = image.data;

        // ===================================
        // BACKGROUND HITAM
        // ===================================

        ctx.fillStyle = "#000";

        ctx.fillRect(0, 0, width, height);

        // ===================================
        // SETTINGS
        // ===================================

        const fontSize = Number(sizeSlider.value);

        const extraX = Number(spacingXSlider.value);

        const extraY = Number(spacingYSlider.value);

        const darkness = Number(darknessSlider.value);

        const contrast = Number(contrastSlider.value);

        const text = "I LOVE YOU";

        // Font
        ctx.font = "bold " + fontSize + "px monospace";

        ctx.textBaseline = "top";

        // Lebar tulisan
        const textWidth = ctx.measureText(text).width;

        // Jarak
        const stepX = Math.max(1, textWidth + extraX);

        const stepY = Math.max(1, fontSize + extraY);

        // ===================================
        // LOOP TEKS
        // ===================================

        for (let y = 0; y < height; y += stepY) {
          for (let x = 0; x < width; x += stepX) {
            // Posisi sample
            let sx = Math.floor(x + textWidth / 2);

            let sy = Math.floor(y + fontSize / 2);

            // Pastikan tidak keluar
            sx = Math.max(0, Math.min(width - 1, sx));

            sy = Math.max(0, Math.min(height - 1, sy));

            const index = (sy * width + sx) * 4;

            const r = pixels[index];

            const g = pixels[index + 1];

            const b = pixels[index + 2];

            // =================================
            // GRAYSCALE
            // =================================

            let gray = 0.299 * r + 0.587 * g + 0.114 * b;

            // =================================
            // CONTRAST
            // =================================

            gray = (gray - 128) * contrast + 128;

            gray = Math.max(0, Math.min(255, gray));

            // =================================
            // NORMALISASI
            // =================================

            let darknessAmount = 1 - gray / 255;

            darknessAmount = Math.pow(darknessAmount, darkness);

            // =================================
            // THRESHOLD
            // =================================

            if (darknessAmount < 0.025) {
              continue;
            }

            // =================================
            // WARNA TEKS
            // =================================

            const brightness = Math.round(40 + darknessAmount * 215);

            ctx.fillStyle =
              "rgb(" + brightness + "," + brightness + "," + brightness + ")";

            // =================================
            // GAMBAR TEKS
            // =================================

            ctx.fillText(text, x, y);
          }
        }
      }

      // =====================================
      // DOWNLOAD
      // =====================================

      function downloadImage() {
        if (!photo) {
          alert("Masukkan foto terlebih dahulu.");

          return;
        }

        const link = document.createElement("a");

        link.download = "portrait-i-love-you.png";

        link.href = canvas.toDataURL("image/png");

        link.click();
      }
    </script>
  </body>
</html>
