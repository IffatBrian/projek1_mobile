<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portrait Coding</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 5px;
      font-size: 24px;
    }

    p {
      color: #aaa;
      margin-top: 5px;
    }

    .controls {
      margin: 20px auto;
      max-width: 700px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    input,
    button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #181818;
      color: white;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #container {
      width: 90%;
      max-width: 900px;
      margin: auto;
      background: #111;
      padding: 10px;
      border: 1px solid #333;
      position: relative;
    }

    canvas {
      width: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .info {
      margin: 15px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <h1>Portrait Coding</h1>
  <p>Grayscale • Dithering • Scanlines • Pixel Effect</p>

  <div class="controls">

    <input
      type="file"
      id="file"
      accept="image/*"
    >

    <button onclick="downloadImage()">
      Simpan
    </button>

  </div>

  <div id="container">
    <canvas id="canvas"></canvas>
  </div>

  <div class="info">
    Upload foto untuk membuat portrait seperti efek coding.
  </div>


<script>

const fileInput = document.getElementById("file");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let originalImage = null;


// ==============================
// UPLOAD FOTO
// ==============================

fileInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  const img = new Image();

  img.onload = function () {

    originalImage = img;

    processImage(img);

  };

  img.src = URL.createObjectURL(file);

});


// ==============================
// PROSES FOTO
// ==============================

function processImage(img) {

  // Ukuran maksimal
  const maxWidth = 700;

  let width = img.width;
  let height = img.height;

  if (width > maxWidth) {

    const scale = maxWidth / width;

    width = maxWidth;
    height = height * scale;

  }

  canvas.width = width;
  canvas.height = height;

  ctx.drawImage(
    img,
    0,
    0,
    width,
    height
  );

  const image = ctx.getImageData(
    0,
    0,
    width,
    height
  );

  const pixels = image.data;


  // ============================
  // GRAYSCALE + CONTRAST
  // ============================

  for (let i = 0; i < pixels.length; i += 4) {

    let r = pixels[i];
    let g = pixels[i + 1];
    let b = pixels[i + 2];

    // Grayscale
    let gray =
      0.299 * r +
      0.587 * g +
      0.114 * b;


    // Tambahkan kontras
    gray =
      ((gray - 128) * 1.7) + 128;


    // Clamp
    gray = Math.max(
      0,
      Math.min(255, gray)
    );


    pixels[i] =
    pixels[i + 1] =
    pixels[i + 2] =
      gray;

  }


  // ============================
  // DITHERING
  // ============================

  dither(
    pixels,
    width,
    height
  );


  ctx.putImageData(
    image,
    0,
    0
  );


  // ============================
  // SCANLINE
  // ============================

  addScanlines();

}


// ==============================
// DITHERING
// ==============================

function dither(
  pixels,
  width,
  height
) {

  const matrix = [
    [0, 2],
    [3, 1]
  ];

  for (
    let y = 0;
    y < height;
    y++
  ) {

    for (
      let x = 0;
      x < width;
      x++
    ) {

      const i =
        (y * width + x) * 4;

      const gray =
        pixels[i];


      const threshold =
        (matrix[y % 2][x % 2] + 0.5)
        * 64;


      const value =
        gray > threshold
          ? 255
          : 20;


      pixels[i] =
      pixels[i + 1] =
      pixels[i + 2] =
        value;

    }

  }

}


// ==============================
// SCANLINES
// ==============================

function addScanlines() {

  ctx.save();

  ctx.globalAlpha = 0.18;

  ctx.fillStyle = "#000";

  for (
    let y = 0;
    y < canvas.height;
    y += 3
  ) {

    ctx.fillRect(
      0,
      y,
      canvas.width,
      1
    );

  }

  ctx.restore();

}


// ==============================
// TAMBAHKAN POLA TITIK
// ==============================

function addDots() {

  const data =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const pixels = data.data;

  ctx.save();

  ctx.globalAlpha = 0.35;

  for (
    let y = 0;
    y < canvas.height;
    y += 5
  ) {

    for (
      let x = 0;
      x < canvas.width;
      x += 5
    ) {

      const i =
        (y * canvas.width + x) * 4;

      const brightness =
        pixels[i];

      if (brightness < 100) {

        ctx.fillStyle = "#000";

        ctx.fillRect(
          x,
          y,
          2,
          2
        );

      }

    }

  }

  ctx.restore();

}


// ==============================
// DOWNLOAD
// ==============================

function downloadImage() {

  if (!originalImage) {

    alert("Masukkan foto terlebih dahulu.");

    return;
  }

  const link =
    document.createElement("a");

  link.download =
    "portrait-coding.png";

  link.href =
    canvas.toDataURL("image/png");

  link.click();

}

</script>

</body>
</html>
